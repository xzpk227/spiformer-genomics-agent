services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SPLIFORMER_URL=http://spliformer:5001
    volumes:
      - ./backend:/app
      - ./reports:/app/reports
    depends_on:
      - spliformer
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  spliformer:
    build: ./spliformer
    ports:
      - "5001:5001"
    volumes:
      - ./ref:/ref   # mount hg38.fa or hg19.fa here
    restart: unless-stopped

